services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - thermidor_data:/app/data
      - thermidor_uploads:/app/public/uploads
    networks:
      - thermidor
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - thermidor
    depends_on:
      app:
        condition: service_healthy
volumes:
  thermidor_data:
  thermidor_uploads:
  caddy_data:
  caddy_config:
networks:
  thermidor:
